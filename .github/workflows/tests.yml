name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: make -C .. format-check-server

      - name: Analyze
        run: make -C .. analyze-server

      - name: Start test database
        run: make -C .. db-start

      # Application test suites share a database and apply migrations at startup.
      - name: Run tests
        run: make -C .. test-server

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Stop test database
        if: always()
        run: make -C .. db-stop

  application-tests:
    name: Application tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: make -C .. test-app
