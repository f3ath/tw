apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.className | quote }}
  rules:
    - {{- if .Values.host }}
      host: {{ .Values.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/v0
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.serverService | quote }}
                port:
                  name: http
          - path: /auth/google/callback
            pathType: Exact
            backend:
              service:
                name: {{ .Values.serverService | quote }}
                port:
                  name: http
