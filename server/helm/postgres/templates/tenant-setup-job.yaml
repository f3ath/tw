apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-tenant-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tenant-setup
          image: {{ .Values.image | quote }}
          env:
            - name: PGHOST
              value: {{ .Release.Name | quote }}
            - name: PGUSER
              value: tw_system
            - name: PGDATABASE
              value: {{ .Values.database | quote }}
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: DATABASE_SYSTEM_PASSWORD
            - name: DATABASE_TENANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: DATABASE_TENANT_PASSWORD
          command:
            - sh
            - -ec
            - |
              until pg_isready; do sleep 2; done
              psql -v ON_ERROR_STOP=1 --set=tenant_password="$DATABASE_TENANT_PASSWORD" <<'SQL'
              SELECT FORMAT(
                  'CREATE ROLE tw_tenant LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L',
                  :'tenant_password'
              )
              WHERE NOT EXISTS (
                  SELECT 1
                  FROM pg_roles
                  WHERE rolname = 'tw_tenant'
              )
              \gexec
              SQL
