services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "ssl=off"]
    environment:
      POSTGRES_DB: tw_e2e
      POSTGRES_USER: tw
      POSTGRES_PASSWORD: tw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tw -d tw_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
